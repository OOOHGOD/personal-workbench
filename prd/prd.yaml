decisions:   # Q1–Q16 全部 resolve
  - {id: Q1, resolution: 定, content: 「工作台」= 一套约定，不含界面/页面/程序；形态另议, rationale: 防止手段锁死需求}
  - {id: Q2, resolution: 定, content: 场景卡保留 1/2/4/6/7，删 3，5 待定（后由 Q10 收敛为 5 张）, rationale: 原场景表出自 archive/legacy-workbench/docs/01:23-29}
  - {id: Q3, resolution: 定→后被改写, content: 自动 = 零点击到达 + 内容预生成；主动推送列为待验证选项, rationale: Q9 激活、Q15 收敛}
  - {id: Q4, resolution: 定, content: 录入 = 一次输入 + 一次确认, rationale: 消除先选分类与事后重抄}
  - {id: Q6, resolution: 定, content: 一条记录可带多个用途标记，不重复录入, rationale: 消除同一事实多处存储}
  - {id: Q7, resolution: 定, content: 不丢 = 单一主副本 + 一次操作产出全量快照 + 定期恢复演练；删「三处实时一致」, rationale: CAP / 同步≠备份 / 12607 事故}
  - {id: Q8, resolution: 定, content: 月更产出 = 证据清单 + 按用途标记分组的证据段落；不做完整简历文件, rationale: Q11 后措辞统一为「证据段落」}
  - {id: Q9, resolution: 否→部分作废, content: 否「提醒只在零点击处呈现」，要求添加邮件提醒通道, rationale: 后由 Q15 改写}
  - {id: Q10, resolution: 定, content: 学习复盘移出场景清单，降为按用途标记筛选的周度回看, rationale: Q6 已把学习统计变成记录上的标记}
  - {id: Q11, resolution: 定, content: 统一叫「证据」；成果 / 成果条目 / 月度成果清单 / 简历增量 / 简历文件列入 _Avoid_, rationale: 消除三词混用}
  - {id: Q12, resolution: 定, content: 带「用于学习统计」或「用于简历」标记的记录不进领导摘要, rationale: 双版本隔离}
  - {id: Q13, resolution: 定→后被改写, content: 选 C = A 截止提醒邮件 + B 月度证据清单邮件，都要，不含手机推送, rationale: 后由 Q15 砍掉 B}
  - {id: Q14, resolution: 定, content: 选 B：数据类别收敛为「一条记录 + 用途标记 + 证据」三层，旧 10 类降级为查看时的筛选方式, rationale: 避开「每加一类改 N 处」}
  - {id: Q15, resolution: 定, content: 选 B：不做 1 天试用，砍掉 B 类邮件，退回「月初零点击看到已生成好的证据清单」；闸门通过, rationale: 改写了 Q9 与 Q13}
  - {id: Q16, resolution: 定, content: 确认「已达成共享理解」，授权落盘 PRD 与 0001 ADR, rationale: 定稿触发条件}

decision_rewrites:      # Q15 对前两轮的改写（不可省略）
  chain: Q9 要主动邮件通道 → Q13=C 定为 A+B 都要 → Q15=B 砍掉 B 的邮件形式
