# =====================================================================
# prd/prd.yaml — 个人工作台 PRD 结构化数据（机器可读版）
# 生成：2026-11-25，由 prd/PRD.md 定稿逐条转写；语义以 PRD.md 为准
# 用途：AI / 程序直接解析，无需读 Markdown 表格
# 规则：status=accepted 的是已定结论；nature=推测/未验证 的不可当作事实
# 2026-11-25 归档重组：取证路径已按 archive/ 前缀更新（行号不变）；
#   完整换算表见 archive/manifest.yaml 的 path_mapping；定稿三件套正文逐字未改
# =====================================================================

meta:
  title: 个人工作台 PRD
  status: accepted          # 验收口径冻结
  version: "1.0"
  date: 2026-11-25
  method: grill-with-docs（grilling + domain-modeling）多轮访谈
  user_confirmation: Q16 用户明确确认「已达成共享理解」
  source_of_truth: prd/PRD.md
  body_rule: 正文不出现技术选型词；技术词/文件名/行号/链接集中在 PRD.md 附录 A
  archive_mode: physical-move          # 2026-11-25 起，历史工程已真实移入 archive/
  archive_mapping: archive/manifest.yaml  # 旧路径换算表（含 README.md 行号例外）

anchor: >-
  不是「拥有一个个人工作台」，而是「让工作/学习/申请/简历证据能以最低摩擦被记下来，
  并在早上、日报、月更、截止前自动出现在眼前，且换设备、换账号、平台变更时不会丢」。

goal: 只定义「什么算做到了」，不定义「长什么样、用什么做」；形态是独立决策（Q1），本 PRD 不预设。

# ---------------------------------------------------------------------
scenarios:
  - {id: S1, moment: 早上工作前, trigger: 打开一个约定位置, expectation: 零点击看到今日重点、逾期、卡住、临近截止}
  - {id: S2, moment: 随时, trigger: 想到一件事, expectation: 一次输入 + 一次确认就记下，不选分类、不事后重抄}
  - {id: S4, moment: 晚间, trigger: 要写日报, expectation: 出两版：自用版全含；领导摘要不含学习与申请}
  - {id: S6, moment: 月初, trigger: 到月初, expectation: 零点击看到已生成好的证据清单 + 按用途标记分组的证据段落（Q15=B）}
  - {id: S7, moment: 任何时候, trigger: 想确认没丢, expectation: 一次操作拿到完整可读的全量副本，且做过恢复演练}
  - {id: R1, moment: 截止前 14 天内, trigger: 到点主动, expectation: 发一封提醒邮件（唯一保留的主动通道）}

# 说明独立成顶层键：YAML 不允许「序列项」与「映射键」在同一层混排
scenario_notes:
  - 学习复盘不再是独立场景，降为按用途标记筛选的周度回看（Q10）
  - 原「工作过程」场景是功能清单，已删除（Q2）
  - 场景卡编号沿用 archive/legacy-workbench/docs/01-需求文档.md:23-29 的 1–7，保留 1/2/4/6/7

# ---------------------------------------------------------------------
acceptance_criteria:   # 每条必须能用「是/否」判定
  - {id: AC-01, criterion: 记一条 = 一次输入 + 一次确认；不需先选分类、不需先打开某个页面、不需事后在别处再抄一遍, zero_code: 能}
  - {id: AC-02, criterion: 同一个事实只存在一份；一条记录可同时带多个用途标记；同一内容不会被录两次, zero_code: 能}
  - {id: AC-03, criterion: 取任一带有「用于学习统计」或「用于简历」标记的记录生成两版日报：领导摘要中不含该记录内容，自用版含, zero_code: 能}
  - {id: AC-04, criterion: 一次操作内产出完整、开放格式、可读、可被别处导入的全量快照；且至少做过一次实际恢复演练并能读回, zero_code: 能}
  - {id: AC-05, criterion: 早上打开约定位置，零点击即可看到今日重点、逾期、卡住、临近截止四类内容, zero_code: 能}
  - {id: AC-06, criterion: 申请截止 14 天内且状态为进行中的条目被呈现，并按截止日倒计时分级（细则见遗留项 L1）, zero_code: 能}
  - {id: AC-07, criterion: 月初产出「证据清单 + 按用途标记分组的证据段落」，可复制；不产出完整简历文件，不自动改写任何简历文档, zero_code: 能}
  - {id: AC-08-A, criterion: 临近截止时，由外部服务主动发出一封提醒邮件, zero_code: 能（有开通门槛，未真实试用）}
  - {id: AC-08-B, criterion: 月初零点击即可看到已生成好的证据清单；不发邮件（Q15=B 的净结果）, zero_code: 能（零点击呈现，非主动发信）}
  - {id: AC-09, criterion: 只做 S1/S2/S4/S6/S7 五张场景卡；学习复盘为筛选式回看，不作为独立场景, zero_code: 能}

failure_modes:
  - {failure: 换设备 / 换账号 / 厂商停服 / 断网 → 取不到数据, ac: AC-04, judgment: 副本须在权限正常时定期产出，不能等出事再导}
  - {failure: 忘了打开 → 月更看不到, ac: AC-08-B（未覆盖）, judgment: 见已知妥协 1}
  - {failure: 同一事实被记两次, ac: AC-02, judgment: 应只有一份}
  - {failure: 私密内容混进领导摘要, ac: AC-03, judgment: 领导摘要应不含}
  - {failure: 提醒邮件没发出 / 发错, ac: AC-08-A, judgment: 需有可查的发送记录或失败可见}

# ---------------------------------------------------------------------
non_goals:
  - 不做多人协作、权限体系
  - 不产出完整简历文件、不自动改写简历文档（Q8）
  - 不要求多份副本实时一致（Q7）
  - 不做手机推送（Q13 选 C，不含手机推送）
  - 不做自定义界面：列为待定，不提前锁死（Q1 形态决策后置）
  - 「打开网页即用」「离线可写」「定期手动导出导入」等旧表述不再作为需求

known_compromises:      # 必须写成受限妥协，不得写成设计偏好
  - id: 1
    content: 月更（S6 / AC-08-B）不主动推送，回到「忘了打开就看不到」；只在截止提醒上被解决，在月更上没有
  - id: 2
    content: 收缩原因是外部服务的发送能力有开通门槛，属工具能力限制，不是用户不需要
  - id: 3
    content: 该取舍未经真实试用验证（Q3 约定「试过再定」，Q15=B 跳过）；换工具时应复核
  - id: 4
    content: 主动邮件通道只剩 A（截止提醒）一类；同类提醒呈现不一致，未来接手者会困惑

constraints_and_assumptions:
  - {item: 单人、唯一使用者, nature: 已确认}
  - {item: 零运维、数据整体可带走, nature: 已确认}
  - {item: 数据主权靠可导出的开放格式快照，不靠「永不换平台」, nature: 已确认}
  - {item: 过去 30 天使用频次低, nature: 推测}
  - {item: 各表记录量为数十至数百条量级, nature: 推测}
  - {item: 不要求长期离线可写, nature: 推测}
  - {item: 申请截止 14 天内 + 倒计时分级, nature: 沿用旧文档，未单独确认}

# ---------------------------------------------------------------------
zero_code_evaluation:
  definition: 「不写任何代码」能否满足，逐条 AC 打勾
  result: 9 类验收条目全部可在零代码前提下满足
  gate: 「只有零方案被证伪才进入架构讨论」的条件未触发 → 不激活技术架构讨论
  form_decision: 形态决策由流程收敛为「不自建前端层」（由用户答案独立推出，非沿用外部诊断）
  caveat: 本评估是纸面可行性核对，不是验收；AC-08-A 有开通门槛且未经真实试用

