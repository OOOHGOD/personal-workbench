glossary:      # 与 prd/GLOSSARY.md 同步；_avoid_ 为禁用同义词
  - term: 工作台
    definition: 一套约定：记录什么、何时出现、怎样算没丢。不指任何界面、页面或程序；形态是另一个独立决策。
    avoid: [系统, 应用, 网站, 页面]
  - term: 记录
    definition: 工作台里最小的事实单元，也是唯一需要保存的东西。同一个事实只存在一份，可以同时用于日报、学习统计与简历；业务类别只是查看时的筛选方式。
    avoid: [条目, 任务, 表行, 日志, 分类]
  - term: 用途标记
    definition: 标注一条记录可用于日报、学习统计或简历的标签。一条记录可以有多个用途标记。
    avoid: [分类, 类型, 字段, 表]
  - term: 自动
    definition: 信息无需人主动查找即可呈现的性质。判定为零点击到达且内容已预先生成；允许在约定时刻由外部服务主动发出提醒，通道见决策记录。
    avoid: [定时任务, 后台同步, 实时一致]
  - term: 不丢
    definition: 任意时刻都能从单一主副本取得一份完整、开放格式、可读、可被别处导入的全量快照，且该快照能被实际恢复。判定看快照能否恢复，不看多副本是否实时一致。
    avoid: [实时同步, 三处一致, 离线可用, 缓存数据]
  - term: 证据
    definition: 一条记录被标记为可用于简历时，它所提供的可核实内容；也是月更产出的唯一内容形态。月更只产出证据清单与按用途标记分组的证据段落。
    avoid: [成果, 成果条目, 月度成果清单, 简历增量, 简历文件]

